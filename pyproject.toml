[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-semantic-layer"
version = "0.1.0"
description = "Intelligent Semantic Layer combining Technical, Semantic, and Ontology metadata layers"
requires-python = ">=3.11"
dependencies = [
    # Data processing
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    # PostgreSQL
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    # Environment
    "python-dotenv>=1.0.0",
    # Azure OpenAI
    "openai>=1.0.0",
    # API
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "ibis-framework[postgres]==10.8.0",
    "rdflib>=7.5.0",
    "boring-semantic-layer==0.1.4",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
